name: ml-book-services
services:
  ollama:
    image: ollama/ollama@sha256:32931b46719f673c05fdbaa81ccb26da18ea4a1c57590a754874ab28ba269eb2
    init: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: ${OLLAMA_MEMORY:-16g}
    memswap_limit: ${OLLAMA_MEMORY:-16g}
    environment:
      OLLAMA_HOST: 0.0.0.0:11434
      OLLAMA_MODELS: /models
      OLLAMA_MAX_LOADED_MODELS: 1
      OLLAMA_NUM_PARALLEL: 1
    ports:
      - "127.0.0.1:${OLLAMA_PORT:-11434}:11434"
    volumes:
      - ollama-models:/models
    networks: [book-services]
    healthcheck:
      test: [CMD, ollama, list]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
networks:
  book-services:
    name: ml-book-services
volumes:
  ollama-models:
