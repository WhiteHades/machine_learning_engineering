[project]
name = "llm-from-scratch"
version = "0.1.0"
description = "Build a Large Language Model (From Scratch) - practice env"
requires-python = ">=3.12,<3.13"
dependencies = [
  "torch==2.10.0+cu128",
  "jupyterlab",
  "ipykernel",
  "nbconvert",
  "pytest>=9.1.1",
  "matplotlib",
  "pandas",
  "numpy",
  "tqdm",
  "setuptools",
  "wheel",
  "llms-from-scratch==1.0.18",
  "tensorflow==2.20.0",
  "psutil",
  "chainlit",
  "ipywidgets",
  "requests",
  "nbformat",
  "nbval",
  "packaging",
  "blobfile",
  "openai",
  "safetensors",
  "scikit-learn",
  "sentencepiece",
  "thop",
  "tokenizers",
  "transformers>=5.0.0",
  "huggingface-hub",
]

[tool.uv.sources]
torch = { index = "pytorch-cu128" }

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true
