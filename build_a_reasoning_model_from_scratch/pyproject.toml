[project]
name = "reasoning-book-practice"
version = "0.1.0"
description = "Build a Reasoning Model (From Scratch) - practice env"
requires-python = ">=3.12,<3.13"
dependencies = [
  "torch==2.10.0+cu128",
  "jupyterlab",
  "ipykernel",
  "nbconvert",
  "pytest>=9.1.1",
  "matplotlib",
  "pandas",
  "numpy",
  "tqdm",
  "setuptools",
  "wheel",
  "reasoning-from-scratch[extra]==0.2.0",
  "huggingface-hub",
  "safetensors",
  "transformers",
]

[tool.uv.sources]
torch = { index = "pytorch-cu128" }

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true
