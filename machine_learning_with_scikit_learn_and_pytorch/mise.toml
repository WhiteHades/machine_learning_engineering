run = 'bash ../scripts/python-book.sh verify "$@"'

[tasks."gpu:verify"]
dir = "{{config_root}}"
run = 'bash ../scripts/python-book.sh gpu-verify "$@"'

[tasks."editor:setup"]
dir = "{{config_root}}"
run = 'bash ../scripts/python-book.sh editor-setup "$@"'

[tasks."edit"]
dir = "{{config_root}}"
