dir = "{{config_root}}"
run = 'bash ../scripts/python-book.sh fetch "$@"'

[tasks."doctor"]
dir = "{{config_root}}"
run = 'bash ../scripts/python-book.sh doctor "$@"'

[tasks."run"]
